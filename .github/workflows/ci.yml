name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Apply Supabase shim + migrations
        run: |
          export PGPASSWORD=postgres
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -f tests/db/supabase-shim.sql
          for f in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -h localhost -U postgres -f "$f"; done
      - run: npm run typecheck
      - run: npm run lint
      - run: npx vitest run
      - run: npm run build
